version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ibvap-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/app/configs
      - ./demo:/app/demo
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ibvap-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
