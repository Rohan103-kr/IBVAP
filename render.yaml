services:
  # ------------------------------------------------------------
  # IBVAP AI Surveillance & Analytics Backend
  # ------------------------------------------------------------
  - type: web
    name: ibvap-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"

  # ------------------------------------------------------------
  # IBVAP React Tactical Command Center Frontend
  # ------------------------------------------------------------
  - type: web
    name: ibvap-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ibvap-backend
          property: host
